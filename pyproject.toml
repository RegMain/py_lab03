[project]
name = "catalog"
version = "0.2.0"
description = "Catalog of Mediafiles"
readme = "README.md"
authors = [
    { name = "RegMain", email = "kharkov.ivan.an@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
catalog = "catalog:main"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
